[project]
name = "tensorcodec"
version = "0.1.1"
description = "NumPy audio/video decoding with TorchCodec-compatible playback semantics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "Suhwan Choi", email = "milkclouds00@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/MilkClouds/tensorcodec"
Issues = "https://github.com/MilkClouds/tensorcodec/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "maturin>=1.8,<2"]
oracle = ["torch==2.14.1", "torchcodec==0.17.0"]

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "tensorcodec._native"
features = ["pyo3/extension-module"]
include = [
    { path = "scripts/*.sh", format = "sdist" },
    { path = "scripts/*.py", format = "sdist" },
    { path = "docs/compatibility.md", format = "sdist" },
    { path = "docs/playback_semantics.md", format = "sdist" },
    { path = "docs/releasing.md", format = "sdist" },
    { path = "docs/package_size.md", format = "sdist" },
    { path = "docs/system_ffmpeg.md", format = "sdist" },
    { path = "packaging/*.json", format = "sdist" },
    { path = "tests/*.py", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
