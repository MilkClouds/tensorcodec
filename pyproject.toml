[project]
name = "avdec"
dynamic = ["version"]
description = "Batch video frame loader for ML training. Drop-in TorchCodec API in pure Python — NumPy output, no PyTorch required."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Suhwan Choi", email = "milkclouds00@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "av>=15.0",  # FFmpeg 7.0 support
    "numpy>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.3.0",
]
benchmark = [
    "torchcodec>=0.1",
    "pyfuse3>=3.2",
    "trio>=0.22",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/your-username/avdec"
Documentation = "https://github.com/your-username/avdec#readme"
Repository = "https://github.com/your-username/avdec"
Issues = "https://github.com/your-username/avdec/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/avdec/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/avdec"]

[tool.ruff]
line-length = 119

[tool.pytest.ini_options]
testpaths = ["tests"]

