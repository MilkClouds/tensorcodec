[package]
name = "tensorcodec-native"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"  # ffmpeg-sys-next 9 builds with let chains
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
png = "=0.18.1"
libc = "0.2"
pyo3 = { version = "0.23", features = ["abi3-py310"] }
numpy = "0.23"
ffmpeg-sys-next = { version = "9.0", default-features = false, features = ["avcodec", "avformat", "swscale", "swresample"] }

[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
cc = "1"
pkg-config = "0.3"
