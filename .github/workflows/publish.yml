name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload validated distributions to PyPI
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .native-deps
          key: manylinux28-x86_64-${{ hashFiles('scripts/build_openssl.sh', 'scripts/build_ffmpeg.sh') }}
      - name: Build portable Linux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: '2_28'
          command: build
          args: --release --locked --auditwheel repair --out dist
          before-script-linux: |
            dnf install -y clang-devel
            prefix="$PWD/.native-deps"
            export PKG_CONFIG_PATH="$prefix/openssl/lib/pkgconfig"
            export LD_LIBRARY_PATH="$prefix/openssl/lib:$prefix/ffmpeg/lib"
            if [ ! -f "$prefix/ffmpeg/lib/libavformat.so.61" ]; then
              dnf install -y nasm perl
              bash scripts/build_openssl.sh "$prefix/openssl"
              bash scripts/build_ffmpeg.sh "$prefix/ffmpeg"
            fi
            export FFMPEG_DIR="$prefix/ffmpeg"
      - name: Build source distribution
        run: |
          python -m pip install 'maturin>=1.8,<2'
          maturin sdist --out dist
      - name: Install tests and pinned reference
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install pytest numpy twine dist/*.whl
          python -m pip install torch==2.14.1 torchcodec==0.17.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Use bundled FFmpeg for the reference
        run: python scripts/configure_oracle_ffmpeg.py
      - name: Validate distribution and playback
        run: |
          python -m twine check dist/*
          pytest tests/test_video_contract.py tests/test_audio_contract.py --backend torchcodec
          pytest --compare
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tensorcodec/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
