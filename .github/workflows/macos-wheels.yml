name: macOS wheels
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          global-environments: ffmpeg=7.1.1=gpl_*
          global-cache: true
      - name: Install build tools
        run: |
          brew install nasm pkg-config coreutils
          uv venv
          uv pip install numpy pytest 'maturin>=1.8,<2' delocate twine
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
          echo "$HOME/.pixi/envs/ffmpeg/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .native-deps/macos
          key: macos14-${{ matrix.arch }}-${{ hashFiles('scripts/build_openssl.sh', 'scripts/build_ffmpeg.sh', 'scripts/build_macos_wheel.sh') }}
      - name: Build and bundle wheel
        run: bash scripts/build_macos_wheel.sh
      - name: Validate installed wheel
        run: |
          uv pip install dist/*.whl
          python -m twine check dist/*
          pytest
          python scripts/check_wheel_runtime.py generate .runtime-fixtures
      - name: Test clean Python 3.10 and 3.13 environments
        run: |
          for version in 3.10 3.13; do
            uv venv "/tmp/runtime-$version" --python "$version"
            uv pip install --python "/tmp/runtime-$version/bin/python" dist/*.whl
            "/tmp/runtime-$version/bin/python" scripts/check_wheel_runtime.py check .runtime-fixtures
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions-macos-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error
