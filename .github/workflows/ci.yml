name: CI
on:
  push:
    branches: [main, tensorcodec]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    uses: ./.github/workflows/macos-wheels.yml
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          global-environments: ffmpeg=7.1.1=gpl_*
          global-cache: true
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install numpy pytest ruff 'maturin>=1.8,<2'
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Configure prebuilt FFmpeg
        run: |
          prefix="$HOME/.pixi/envs/ffmpeg"
          test -f "$prefix/include/libavcodec/avcodec.h"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          "$prefix/bin/ffmpeg" -version
      - name: Static checks
        run: |
          ruff check src/tensorcodec tests scripts
          ruff format --check src/tensorcodec tests scripts
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --manifest-path native/Cargo.toml --locked -- -D warnings
      - name: Build extension against prebuilt FFmpeg
        run: maturin develop --locked
      - name: Install pinned reference
        run: python -m pip install torch==2.14.1 torchcodec==0.17.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate independent contract against reference
        run: pytest tests/test_video_contract.py tests/test_audio_contract.py --backend torchcodec
      - name: Run contract and differential tests
        run: pytest --compare
