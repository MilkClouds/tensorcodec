name: CI
on:
  push:
    branches: [main, tensorcodec]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libssl-dev ffmpeg patchelf nasm
          python -m pip install numpy pytest ruff 'maturin>=1.8,<2'
      - name: Build bundled FFmpeg
        run: scripts/build_ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
      - name: Configure native build
        run: |
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg/lib" >> "$GITHUB_ENV"
      - name: Static checks
        run: |
          ruff check src/tensorcodec tests
          ruff format --check src/tensorcodec tests
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --manifest-path native/Cargo.toml --locked -- -D warnings
      - name: Build and install repaired wheel
        run: |
          maturin build --release --auditwheel repair --out dist
          python -m pip install dist/*.whl
      - name: Verify minimal installation
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/runtime/bin/python" -c 'import importlib.util, tensorcodec; assert importlib.util.find_spec("torch") is None; assert importlib.util.find_spec("av") is None'
      - name: Install pinned reference
        run: python -m pip install torch==2.14.1 torchcodec==0.17.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate independent contract against reference
        run: pytest tests/test_video_contract.py tests/test_audio_contract.py --backend torchcodec
      - name: Run contract and differential tests against installed wheel
        run: pytest --compare
      - uses: actions/upload-artifact@v4
        with:
          name: tensorcodec-linux-x86_64
          path: dist/*.whl
